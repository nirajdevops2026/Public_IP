pool: raj-pool
trigger:
- main
- feature

stages:
- stage: terraform
  displayName: terraform-install
  jobs:
  - job: initAndvalidate
    displayName: Install
    steps:
    - task: TerraformInstaller@1
      inputs:
        terraformVersion: 'latest'

- stage: terrafrom02
  displayName: init
  jobs:
  - job: init
    displayName: Init
    steps:
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'init'
        backendServiceArm: 'one-app-service-connection'
        backendAzureRmResourceGroupName: '0001'
        backendAzureRmStorageAccountName: 'raj0001'
        backendAzureRmContainerName: 'raj-container-0001'
        backendAzureRmKey: 'raj-state'

- stage: terrafrom03
  displayName: plan
  jobs:
  - job: plan
    displayName: plan
    steps:
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'plan'
        environmentServiceNameAzureRM: 'one-app-service-connection'

- stage: terrafrom01
  displayName: apply
  jobs:
  - job: apply
    displayName: apply
    steps:
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'apply'
        environmentServiceNameAzureRM: 'one-app-service-connection'
