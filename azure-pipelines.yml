pool: raj-pool
trigger:
- main
- feature

stages:
- stage: terraform
  displayName: terraform-install
  jobs:
  - job: initAndvalidate
    displayName: Install
    steps:
    - task: TerraformInstaller@1
      inputs:
        terraformVersion: 'latest'

- stage: terrafrom01
  displayName: init-validate
  jobs:
  - job: init
    displayName: Init
    steps:
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'init'
        backendServiceArm: 'one-app-service-connection'
        backendAzureRmResourceGroupName: '0001'
        backendAzureRmStorageAccountName: 'raj0001'
        backendAzureRmContainerName: 'raj-container-0001'
        backendAzureRmKey: 'raj-state'

    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'plan'
        environmentServiceNameAzureRM: 'one-app-service-connection'
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'apply'
        environmentServiceNameAzureRM: 'one-app-service-connection'
